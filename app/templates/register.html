{% extends "base.html" %}{% block title %}Create Identity{% endblock %}{% block content %}<section class="page page--centered"><div class="auth-card glass"><p class="eyebrow">A NEW TIMELINE AWAITS</p><h1>CREATE YOUR IDENTITY</h1><form method="post" action="{{ url_for('auth.register') }}" class="form" data-loading-form><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" autocomplete="username" required maxlength="100" autofocus></label><label>Password <small>At least 6 characters</small><input id="password" type="password" name="password" autocomplete="new-password" required minlength="6"><button class="password-toggle" type="button" data-password-toggle="#password">SHOW</button></label><label>Confirm password<input id="confirm" type="password" name="confirm" autocomplete="new-password" required minlength="6"><button class="password-toggle" type="button" data-password-toggle="#confirm">SHOW</button></label><button class="btn btn--primary btn--full" type="submit" data-submit-text="CREATING IDENTITY...">ENTER THE MULTIVERSE</button></form><p class="auth-card__footer">ALREADY HAVE AN ACCOUNT? <a href="{{ url_for('auth.login') }}">LOGIN</a></p></div></section>{% endblock %}
