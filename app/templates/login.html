{% extends "base.html" %}{% block title %}Enter the Multiverse{% endblock %}{% block content %}<section class="page page--centered"><div class="auth-card glass"><p class="eyebrow">CONTINUE YOUR STORY</p><h1>ENTER THE MULTIVERSE</h1><p>Choose where your story continues.</p><form method="post" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" class="form" data-loading-form><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" autocomplete="username" required autofocus maxlength="100"></label><label>Password<input id="password" type="password" name="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle="#password">SHOW</button></label><button class="btn btn--primary btn--full" type="submit" data-submit-text="ENTERING REALITY...">ENTER REALITY</button></form><p class="auth-card__footer"><a href="{{ url_for('auth.register') }}">CREATE ACCOUNT</a> · <a href="{{ url_for('main.index') }}">RETURN HOME</a></p></div></section>{% endblock %}
